<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registration Form</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=Syne:wght@700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <div class="bg-orbs">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
  </div>

  <main class="wrapper">

    <header class="form-header">
      <h1>Create your account</h1>
      <p>Join the community. It only takes a minute.</p>
    </header>

    <form method="post" action="https://register-demo.freecodecamp.org">

      <fieldset>
        <legend>Personal info</legend>
        <div class="field-grid">
          <label for="first-name">
            <span class="label-text">First name</span>
            <input id="first-name" name="first-name" type="text" placeholder="Ada" required />
          </label>
          <label for="last-name">
            <span class="label-text">Last name</span>
            <input id="last-name" name="last-name" type="text" placeholder="Lovelace" required />
          </label>
        </div>
        <label for="email">
          <span class="label-text">Email address</span>
          <input id="email" name="email" type="email" placeholder="ada@example.com" required />
        </label>
        <label for="new-password">
          <span class="label-text">Password</span>
          <input
            id="new-password"
            name="new-password"
            type="password"
            placeholder="8+ characters"
            pattern="[a-z0-5]{8,}"
            title="Minimum 8 characters, lowercase letters and numbers 0-5 only"
            required
          />
        </label>
      </fieldset>

      <fieldset>
        <legend>Account type</legend>
        <div class="radio-group">
          <label for="personal-account" class="radio-card">
            <input id="personal-account" type="radio" name="account-type" value="personal" checked />
            <span class="radio-label">Personal</span>
          </label>
          <label for="business-account" class="radio-card">
            <input id="business-account" type="radio" name="account-type" value="business" />
            <span class="radio-label">Business</span>
          </label>
        </div>
      </fieldset>

      <fieldset>
        <legend>Profile details</legend>
        <label for="profile-picture">
          <span class="label-text">Profile picture</span>
          <input id="profile-picture" type="file" name="file" accept="image/*" />
        </label>
        <label for="age">
          <span class="label-text">Age <span class="hint">(13 years minimum)</span></span>
          <input id="age" type="number" name="age" min="13" max="120" placeholder="—" />
        </label>
        <label for="referrer">
          <span class="label-text">How did you hear about us?</span>
          <select id="referrer" name="referrer">
            <option value="">(select one)</option>
            <option value="1">freeCodeCamp News</option>
            <option value="2">freeCodeCamp YouTube Channel</option>
            <option value="3">freeCodeCamp Forum</option>
            <option value="4">Other</option>
          </select>
        </label>
        <label for="bio">
          <span class="label-text">Short bio <span class="hint">(optional)</span></span>
          <textarea id="bio" name="bio" rows="3" placeholder="I like coding on the beach..."></textarea>
        </label>
      </fieldset>

      <div class="form-footer">
        <label for="terms-and-conditions" class="checkbox-label">
          <input name="terms" id="terms-and-conditions" type="checkbox" required />
          <span class="checkbox-custom"></span>
          <span>I agree to the <a href="https://www.freecodecamp.org/news/terms-of-service" target="_blank" rel="noopener">terms and conditions</a></span>
        </label>
        <button type="submit">Create account →</button>
      </div>

    </form>

  </main>

</body>
</html>
